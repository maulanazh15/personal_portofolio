name: Deploy portfolio

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: portfolio-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Build Go binaries
        run: |
          cd backend
          go mod download
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o portfolio-api ./cmd/server
          GOOS=linux GOARCH=arm GOARM=7 go build -trimpath -ldflags="-s -w" -o portfolio-import ./cmd/import

      - name: Seed content database
        run: |
          cd backend
          mkdir -p /tmp/portfolio-data
          go run ./cmd/import -db /tmp/portfolio-data/portfolio.db -dir ../content

      - name: Start content API
        run: |
          cd backend
          PORTFOLIO_ADDR=127.0.0.1:8099 \
          PORTFOLIO_DB=/tmp/portfolio-data/portfolio.db \
          PORTFOLIO_ADMIN_TOKEN=ci-only \
          go run ./cmd/server > /tmp/portfolio-api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8099/healthz

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          CONTENT_API_URL=http://127.0.0.1:8099 npm run build

      - name: Package deployment artifacts
        run: |
          tar -czf portfolio-dist.tar.gz -C frontend dist
          tar -czf portfolio-seed.tar.gz content
          cp backend/portfolio-api backend/portfolio-import .
          chmod 750 portfolio-api portfolio-import
          mkdir -p /tmp/portfolio-deploy
          cp portfolio-dist.tar.gz portfolio-seed.tar.gz portfolio-api portfolio-import deploy/scripts/remote-deploy.sh /tmp/portfolio-deploy/

      - name: Check deployment secrets
        id: deploy_config
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SSH deployment secrets are not configured; build-only run."
          fi

      - name: Configure SSH
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          REMOTE_DIR='$PREFIX/tmp/portfolio-deploy'
          tar -czf - -C /tmp/portfolio-deploy . | ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "rm -rf $REMOTE_DIR && mkdir -p $REMOTE_DIR && tar -xzf - -C $REMOTE_DIR"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            "SVDIR=\$PREFIX/var/service sh $REMOTE_DIR/remote-deploy.sh"

      - name: Smoke test
        if: steps.deploy_config.outputs.enabled == 'true'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$SSH_USER@$SSH_HOST" \
            'curl -fsS -H "Host: portofolio.homelabchester.my.id" http://127.0.0.1:8080/ >/dev/null && curl -fsS -H "Host: portofolio.homelabchester.my.id" http://127.0.0.1:8080/api/healthz'
